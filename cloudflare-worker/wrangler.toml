name = "oil-agent-cron-trigger"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Reliable, timing-only. This Worker does no agent logic itself -- it just
# pokes GitHub's workflow_dispatch API on a schedule GitHub's own free
# scheduled-workflow cron can't reliably hit (observed: configured for
# every 10 minutes, actually firing every 2-6 hours).
#
# Every 3 hours (8 cycles/day), calibrated against the Groq free-tier daily
# budget (200k tokens/day): observed usage on 2026-09-27 was ~21,862
# tokens/cycle (196,759 tokens over 9 cycles), so 8 cycles/day uses
# ~175k tokens, leaving ~25k headroom for heavier cycles. Re-check this
# average if agent.py's tool-calling loop changes materially, and adjust
# the interval to keep 8 x avg_tokens_per_cycle comfortably under 200k.
[triggers]
crons = ["0 */3 * * *"]

[vars]
GITHUB_OWNER = "killeve1"
GITHUB_REPO = "agent_test_dem"
GITHUB_WORKFLOW_FILE = "run_agent.yml"
GITHUB_REF = "main"

# Secret (never committed): set with
#   npx wrangler secret put GITHUB_TOKEN
# A fine-grained GitHub PAT scoped to just this repo, with
# "Actions: write" permission (needed to call workflow_dispatch).
