name: Oil News Agent Cycle

on:
  schedule:
    # Every 30 minutes. GitHub may delay this by a few minutes under load —
    # fine for a news-driven strategy, not for anything latency-sensitive.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated ledger/log back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/agent.py

      - name: Commit updated ledger and logs
        run: |
          git config user.name "oil-news-agent"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Agent cycle: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
