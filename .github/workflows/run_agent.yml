name: Oil News Agent Cycle

on:
  schedule:
    # Every 3 hours, matching the Cloudflare Worker's cron trigger (see
    # cloudflare-worker/wrangler.toml for the Groq free-tier budget math
    # behind this interval). This trigger is an unreliable free backstop
    # (observed firing every 2-6 hours rather than on schedule) in case the
    # Worker or its GitHub token lapses -- kept at the same interval as the
    # Worker so an occasional overlap doesn't blow the daily token budget.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated ledger/log back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/agent.py

      - name: Commit updated ledger and logs
        run: |
          git config user.name "oil-news-agent"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Agent cycle: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
